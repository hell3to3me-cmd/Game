<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#0b1426">

<link rel="apple-touch-icon" href="icon-180.png">

<title>Песочница миров</title>
<style>
:root{--panel:rgba(12,22,42,.9);--line:rgba(255,255,255,.14);--acc:#ffb84d;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#06101f;color:#eaf1ff;font:14px -apple-system,system-ui,"Segoe UI",sans-serif;overscroll-behavior:none;position:fixed;width:100%}
#c{position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:inherit;border:1px solid var(--line);background:rgba(255,255,255,.07);border-radius:12px;padding:0;cursor:pointer}
button:active{background:rgba(255,255,255,.2)}
#top{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 6px) 8px 6px;display:flex;gap:6px;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sq{width:42px;height:42px;font-size:18px;flex:none}
#stats{flex:1;min-width:0;display:flex;gap:10px;overflow-x:auto;padding:0 10px;height:42px;align-items:center;white-space:nowrap;font-size:13px;scrollbar-width:none}
#stats::-webkit-scrollbar{display:none}
#stats span b{font-weight:600}
#bottom{position:fixed;left:0;right:0;bottom:0;padding:6px 8px calc(var(--sab) + 6px);pointer-events:none}
#bottom>*{pointer-events:auto}
#bar{display:flex;gap:6px;margin-bottom:6px}
.tab{flex:1;height:38px;font-size:13px}
.tab.on{background:var(--acc);color:#241600;border-color:var(--acc);font-weight:600}
#tools{display:flex;gap:6px;overflow-x:auto;padding:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.tool{flex:none;width:62px;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tool i{font-style:normal;font-size:26px;line-height:1}
.tool span{font-size:11px;opacity:.85}
.tool.on{border-color:var(--acc);background:rgba(255,184,77,.25);box-shadow:0 0 0 1px var(--acc) inset}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 62px);transform:translateX(-50%);padding:8px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
#modal.show{display:flex}
#box{width:100%;max-width:380px;max-height:86%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
#box h2{margin:0 0 2px;font-size:18px}
#box p{margin:0;line-height:1.4;font-size:13px;opacity:.9;-webkit-user-select:text;user-select:text}
#box button{height:46px;font-size:15px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <button id="bPlay" class="pill sq" aria-label="Пауза">⏸</button>
  <button id="bSpeed" class="pill sq" aria-label="Скорость">×1</button>
  <div id="stats" class="pill"></div>
  <button id="bMenu" class="pill sq" aria-label="Меню">☰</button>
</div>

<div id="toast"></div>

<div id="bottom">
  <div id="bar">
    <button id="bHand" class="pill tab" style="flex:0 0 52px">✋</button>
    <button id="bBrush" class="pill tab" style="flex:0 0 66px">● 2</button>
    <button class="pill tab" data-tab="terrain">🌍 Земля</button>
    <button class="pill tab" data-tab="life">👥 Жизнь</button>
    <button class="pill tab" data-tab="power">⚡ Силы</button>
  </div>
  <div id="tools" class="pill"></div>
</div>

<div id="modal"><div id="box" class="pill"></div></div>

<script>
(()=>{
'use strict';
const W=160,H=160,B=8,NB=W/B,MAXPOP=700;
const COL=[[27,63,138],[47,111,192],[227,208,140],[86,168,69],[47,122,58],[150,140,86],[119,116,110],[242,246,250],[232,80,26],[58,51,48]];
const HUM={human:1,elf:1,orc:1,dwarf:1};
const SP={
  human:{hp:100,mv:5,life:1000,dmg:12,col:'#4a7be0'},
  elf:{hp:80,mv:4,life:1800,dmg:11,col:'#3fbf6a'},
  orc:{hp:130,mv:4,life:800,dmg:15,col:'#7ab33f'},
  dwarf:{hp:120,mv:6,life:1400,dmg:14,col:'#c0763a'},
  sheep:{hp:30,mv:8,life:700,dmg:0,col:'#f4f4f0'},
  wolf:{hp:60,mv:3,life:800,dmg:14,col:'#8d9298'}
};
const PREF={
  human:[-9,.3,1,3,2,1.5,-9,-9,-9,1.5],
  elf:[-9,.2,.5,2,4,1,-9,-9,-9,.5],
  orc:[-9,.2,1,2,2,3,-9,1,-9,2],
  dwarf:[-9,.2,.5,1,1,4,3,1.5,-9,1],
  sheep:[-9,.1,.5,4,.8,1,-9,-9,-9,.5],
  wolf:[-9,.2,.5,2,3,2,-9,1,-9,1]
};
const RACE_COL={human:'#c0392b',elf:'#2e8b57',orc:'#5a2d2d',dwarf:'#8a5a2b'};
const BR=[.5,2.2,4.2,7], SPAWN_N=[1,3,6,10];

const TOOLS={
  terrain:[
    {id:'deep',n:'Океан',i:'🌊',kind:'tile',tile:0},
    {id:'shallow',n:'Вода',i:'💧',kind:'tile',tile:1},
    {id:'sand',n:'Песок',i:'🏖️',kind:'tile',tile:2},
    {id:'grass',n:'Трава',i:'🌱',kind:'tile',tile:3},
    {id:'forest',n:'Лес',i:'🌲',kind:'tile',tile:4},
    {id:'hill',n:'Холмы',i:'🟤',kind:'tile',tile:5},
    {id:'mount',n:'Горы',i:'⛰️',kind:'tile',tile:6},
    {id:'snow',n:'Снег',i:'❄️',kind:'tile',tile:7},
    {id:'lava',n:'Лава',i:'🌋',kind:'tile',tile:8}
  ],
  life:[
    {id:'human',n:'Человек',i:'🧑',kind:'spawn',t:'human'},
    {id:'elf',n:'Эльф',i:'🧝',kind:'spawn',t:'elf'},
    {id:'orc',n:'Орк',i:'👹',kind:'spawn',t:'orc'},
    {id:'dwarf',n:'Гном',i:'🧔',kind:'spawn',t:'dwarf'},
    {id:'sheep',n:'Овца',i:'🐑',kind:'spawn',t:'sheep'},
    {id:'wolf',n:'Волк',i:'🐺',kind:'spawn',t:'wolf'}
  ],
  power:[
    {id:'fire',n:'Огонь',i:'🔥',kind:'fire'},
    {id:'bolt',n:'Молния',i:'⚡',kind:'bolt'},
    {id:'meteor',n:'Метеорит',i:'☄️',kind:'meteor'},
    {id:'rain',n:'Дождь',i:'🌧️',kind:'rain'},
    {id:'kill',n:'Смерть',i:'💀',kind:'kill'}
  ]
};
const HAND={id:'hand',kind:'hand'};

/* ---------- состояние ---------- */
let tiles=new Uint8Array(W*H), shade=new Int8Array(W*H), fire=new Uint8Array(W*H);
const fires=new Set(), bld=new Map();
let cr=[], nid=1, year=0, tickN=0, dirty=true;
let bk=Array.from({length:NB*NB},()=>[]);
const rains=[], effects=[];
let speed=1, paused=false, brush=1, tool=TOOLS.life[0], tab='life';

/* ---------- генерация мира ---------- */
function hash(x,y,s){let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,2147483647))|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967295}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s){let t=0,a=.5,f=1,n=0;for(let i=0;i<5;i++){t+=vnoise(x*f,y*f,s+i)*a;n+=a;a*=.5;f*=2}return t/n}

function resetState(){
  fire.fill(0);fires.clear();bld.clear();cr=[];rains.length=0;effects.length=0;year=0;tickN=0;dirty=true;
}
function genWorld(seed){
  resetState();
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=y*W+x,dx=(x/W-.5)*2,dy=(y/H-.5)*2,d2=dx*dx+dy*dy;
    let e=fbm(x/38,y/38,seed);e=(e-.5)*1.7+.5-.32*d2;
    let k=e<.30?0:e<.37?1:e<.41?2:e<.60?3:e<.68?5:e<.76?6:7;
    if(k===3&&fbm(x/11,y/11,seed+99)>.53&&hash(x,y,seed)<.8)k=4;
    tiles[i]=k;
    shade[i]=Math.round((hash(x,y,7)-.5)*(k<2?8:16));
  }
  // начальные животные
  for(let n=0;n<28;n++){const p=randLand(3);if(p)addCr('sheep',p[0],p[1],Math.random()*200)}
  for(let n=0;n<3;n++){const p=randLand(3);if(p)addCr('wolf',p[0],p[1],Math.random()*200)}
}
function randLand(kind){for(let n=0;n<400;n++){const x=(Math.random()*W)|0,y=(Math.random()*H)|0;const k=tiles[y*W+x];if(k===kind||(kind==null&&k>=2&&k<=5))return[x,y]}return null}

/* ---------- существа ---------- */
function walk(t,k){if(k===0||k===8)return false;if(k===6)return t==='dwarf';if(k===7)return t==='dwarf'||t==='orc'||t==='wolf';return true}
function mk(t,x,y,age){const s=SP[t];return{id:nid++,t,x,y,fx:x,fy:y,hp:s.hp,age:age||0,hun:Math.random()*20,mt:(Math.random()*s.mv)|0,cd:40+((Math.random()*60)|0),bcd:20,life:s.life*(.75+Math.random()*.5),dx:0,dy:0,face:1,hx:-1,hy:-1,dead:false}}
function addCr(t,x,y,age){if(cr.length>=MAXPOP||x<0||y<0||x>=W||y>=H)return null;const c=mk(t,x,y,age);cr.push(c);return c}
function kill(c){c.dead=true}
function sgn(v){return v>0?1:v<0?-1:0}
function cheb(ax,ay,bx,by){return Math.max(Math.abs(ax-bx),Math.abs(ay-by))}
function rebuild(){for(const a of bk)a.length=0;for(const c of cr)bk[(c.y>>3)*NB+(c.x>>3)].push(c)}
function forNear(x,y,r,fn){
  const x0=Math.max(0,(x-r)>>3),x1=Math.min(NB-1,(x+r)>>3),y0=Math.max(0,(y-r)>>3),y1=Math.min(NB-1,(y+r)>>3);
  for(let by=y0;by<=y1;by++)for(let bx=x0;bx<=x1;bx++){const a=bk[by*NB+bx];for(let k=0;k<a.length;k++){const o=a[k];if(o.dead)continue;if(cheb(x,y,o.x,o.y)<=r&&fn(o)===true)return}}
}
function hostile(a,b){
  if(a.t===b.t||a.t==='sheep')return false;
  if(a.t==='wolf'||b.t==='wolf')return true;
  if(a.t==='orc')return b.t!=='sheep'||a.hun>55;
  if(b.t==='orc')return true;
  if(b.t==='sheep')return a.hun>60;
  return false;
}
function houseNear(x,y,r,race){
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const b=bld.get(ny*W+nx);if(b&&(!race||b.race===race))return b}
  return null;
}
function go(c,dx,dy){
  const o=[[dx,dy]];
  if(dx&&dy){o.push([dx,0],[0,dy])}else if(dx){o.push([dx,1],[dx,-1])}else{o.push([1,dy],[-1,dy])}
  for(const [a,b] of o){
    if(!a&&!b)continue;const nx=c.x+a,ny=c.y+b;if(nx<0||ny<0||nx>=W||ny>=H)continue;
    const j=ny*W+nx;if(!walk(c.t,tiles[j])||fire[j])continue;
    c.x=nx;c.y=ny;if(a)c.face=a;c.dx=a;c.dy=b;return true
  }
  return false;
}
function toward(c,t){return go(c,sgn(t.x-c.x),sgn(t.y-c.y))}
function away(c,t){const dx=-sgn(t.x-c.x),dy=-sgn(t.y-c.y);if(!dx&&!dy)return go(c,(Math.random()*3|0)-1,(Math.random()*3|0)-1);return go(c,dx,dy)}
function wander(c){
  if(Math.random()<.25)return;
  const pf=PREF[c.t];let best=-1e9,bx=0,by=0;
  for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){
    if(!a&&!b)continue;const nx=c.x+a,ny=c.y+b;if(nx<0||ny<0||nx>=W||ny>=H)continue;
    const j=ny*W+nx,k=tiles[j];if(!walk(c.t,k))continue;
    let sc=pf[k]+Math.random()*2;
    if(a===c.dx&&b===c.dy)sc+=1.2;
    if(fire[j])sc-=30;
    if(c.hx>=0){const d0=Math.abs(c.x-c.hx)+Math.abs(c.y-c.hy);if(d0>8)sc+=(d0-(Math.abs(nx-c.hx)+Math.abs(ny-c.hy)))*1.5}
    if(sc>best){best=sc;bx=a;by=b}
  }
  if(best>-1e8){c.x+=bx;c.y+=by;c.dx=bx;c.dy=by;if(bx)c.face=bx}
}
function spawnNear(t,x,y,home){
  for(let n=0;n<8;n++){
    const nx=x+((Math.random()*3)|0)-1,ny=y+((Math.random()*3)|0)-1;
    if(nx<0||ny<0||nx>=W||ny>=H||!walk(t,tiles[ny*W+nx]))continue;
    const k=addCr(t,nx,ny,0);if(k&&home){k.hx=home.hx;k.hy=home.hy}return k
  }
  return null;
}

function think(c){
  const sp=SP[c.t],i=c.y*W+c.x,k=tiles[i];
  if(k===0||k===8){kill(c);return}
  if(fire[i]){c.hp-=40;if(c.hp<=0){kill(c);return}}
  c.age++;if(c.age>c.life){kill(c);return}
  if(c.cd>0)c.cd--;if(c.bcd>0)c.bcd--;
  // голод и еда
  if(c.t==='sheep'){c.hun+=.5;if(k===3||k===4)c.hun-=4}
  else if(c.t==='wolf'){c.hun+=.35}
  else{
    c.hun+=.6;let f=0;
    if(k===3||k===4)f=2.2;else if(k===5&&(c.t==='dwarf'||c.t==='orc'))f=1.2;else if(k===6&&c.t==='dwarf')f=1;else if(k===1)f=1.5;else if(k===2)f=.8;
    c.hun-=f;
    if(k===4&&c.t!=='elf'&&Math.random()<.015){tiles[i]=3;dirty=true} // рубка леса
  }
  if(c.hun<0)c.hun=0;
  if(c.hun>=100){c.hp-=6;c.hun=100;if(c.hp<=0){kill(c);return}}
  else if(c.hp<sp.hp&&c.hun<50)c.hp+=1;

  // враги
  const R=c.t==='wolf'?(c.hun>30?12:2):c.t==='orc'?14:c.t==='sheep'?5:7;
  let foe=null,fd=99;
  forNear(c.x,c.y,R,o=>{
    if(o===c)return;
    const h=c.t==='sheep'?hostile(o,c):hostile(c,o);if(!h)return;
    const d=cheb(c.x,c.y,o.x,o.y);if(d<fd){fd=d;foe=o}
  });
  if(foe){
    if(c.t==='sheep'){away(c,foe);return}
    if(fd<=1){
      if(Math.random()<.7){foe.hp-=sp.dmg*(.7+Math.random()*.6);if(foe.hp<=0){kill(foe);if(c.t==='wolf'||c.hun>40)c.hun=Math.max(0,c.hun-55)}}
      return;
    }
    let al=0;
    if(c.t!=='wolf'&&c.t!=='orc')forNear(c.x,c.y,5,o=>{if(o!==c&&o.t===c.t)al++});
    if(c.t==='wolf'||c.t==='orc'||foe.t==='sheep'||al>=2)toward(c,foe);else away(c,foe);
    return;
  }
  // орки громят постройки
  if(c.t==='orc'){
    let best=null,bd=11;
    for(const b of bld.values()){if(b.race==='orc')continue;const d=cheb(b.x,b.y,c.x,c.y);if(d<bd){bd=d;best=b}}
    if(best){
      if(bd<=1){best.hp-=18;if(best.hp<=0){bld.delete(best.y*W+best.x)}}
      else toward(c,best);
      return;
    }
  }
  const adult=c.age>c.life*.12;
  // размножение
  if(adult&&c.cd<=0&&c.hun<60&&cr.length<MAXPOP&&Math.random()<(HUM[c.t]?.15:.06)){
    let al=0,crowd=0;
    forNear(c.x,c.y,3,o=>{if(o!==c&&o.t===c.t){crowd++;if(o.age>o.life*.12)al++}});
    const home=HUM[c.t]?houseNear(c.x,c.y,6,c.t):true;
    if(al>=1&&crowd<7&&home){spawnNear(c.t,c.x,c.y,c);c.cd=70+((Math.random()*60)|0)}
  }
  // строительство
  if(HUM[c.t]&&adult&&c.bcd<=0){
    c.bcd=30;
    if((k===2||k===3||k===5||(k===4&&c.t==='elf'))&&!bld.has(i)&&bld.size<400&&Math.random()<.35&&!houseNear(c.x,c.y,2,null)){
      let al=0;forNear(c.x,c.y,5,o=>{if(o!==c&&o.t===c.t)al++});
      if(al>=1){bld.set(i,{x:c.x,y:c.y,race:c.t,hp:60});c.hx=c.x;c.hy=c.y}
    }
  }
  wander(c);
}

/* ---------- огонь и природа ---------- */
function ignite(i,force){
  if(fire[i])return;const k=tiles[i];if(k===0||k===1||k===8)return;
  const hasB=bld.has(i);if(!force&&!(k===3||k===4||hasB))return;
  fire[i]=k===4?60:hasB?45:k===3?28:16;fires.add(i);
}
function fireStep(){
  if(!fires.size)return;
  for(const i of Array.from(fires)){
    const t=fire[i]-1;
    if(t<=0){fire[i]=0;fires.delete(i);const k=tiles[i];if(k===3||k===4){tiles[i]=9;dirty=true}bld.delete(i);continue}
    fire[i]=t;
    if(Math.random()<.5){
      const x=i%W,y=(i/W)|0,r=Math.random()*4|0;
      const nx=x+(r===0?1:r===1?-1:0),ny=y+(r===2?1:r===3?-1:0);
      if(nx<0||ny<0||nx>=W||ny>=H)continue;
      const n=ny*W+nx,kn=tiles[n],p=kn===4?.12:kn===3?.06:0;
      if((bld.has(n)&&Math.random()<.3)||Math.random()<p)ignite(n);
    }
  }
}
function growStep(){
  for(let n=0;n<300;n++){
    const i=(Math.random()*W*H)|0,k=tiles[i];
    if(k===9){if(Math.random()<.15){tiles[i]=3;dirty=true}}
    else if(k===8){if(Math.random()<.02){tiles[i]=6;dirty=true}}
    else if(k===3&&Math.random()<.15){
      const x=i%W,y=(i/W)|0,nx=x+((Math.random()*3)|0)-1,ny=y+((Math.random()*3)|0)-1;
      if(nx>=0&&ny>=0&&nx<W&&ny<H&&tiles[ny*W+nx]===4&&!bld.has(i)&&!fire[i]){tiles[i]=4;dirty=true}
    }
  }
}
function rainStep(){
  for(let n=rains.length-1;n>=0;n--){
    const r=rains[n];if(--r.left<=0){rains.splice(n,1);continue}
    for(let m=0;m<8;m++){
      const a=Math.random()*6.283,d=Math.sqrt(Math.random())*r.r,x=Math.round(r.x+Math.cos(a)*d),y=Math.round(r.y+Math.sin(a)*d);
      if(x<0||y<0||x>=W||y>=H)continue;const i=y*W+x;
      if(fire[i]){fire[i]=0;fires.delete(i)}
      if(tiles[i]===9&&Math.random()<.5){tiles[i]=3;dirty=true}
    }
  }
}
function tick(){
  tickN++;if(tickN%100===0)year++;
  rebuild();
  for(const c of cr){if(c.dead)continue;if(--c.mt<=0){c.mt=SP[c.t].mv;think(c)}}
  cr=cr.filter(c=>!c.dead);
  fireStep();growStep();rainStep();
}

/* ---------- инструменты ---------- */
function setTile(i,v){
  if(tiles[i]===v)return;tiles[i]=v;dirty=true;
  if(v!==2&&v!==3&&v!==5&&v!==4)bld.delete(i);
  if(v===0||v===1||v===8||v===9){fire[i]=0;fires.delete(i)}
}
function circle(x,y,r,fn){
  const R=Math.ceil(r);
  for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
    if(dx*dx+dy*dy>r*r)continue;const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;fn(nx,ny,ny*W+nx,Math.sqrt(dx*dx+dy*dy))
  }
}
function killAt(x,y,r){
  for(const c of cr)if(!c.dead&&(c.x-x)**2+(c.y-y)**2<=r*r)kill(c);
  circle(x,y,r,(nx,ny,i)=>bld.delete(i));
}
function lightning(x,y){
  effects.push({k:'bolt',x,y,t0:performance.now()});
  killAt(x,y,1.5);ignite(y*W+x,true);
  circle(x,y,1.5,(nx,ny,i)=>ignite(i,false));
}
function crater(x,y){
  const R=3.4;
  circle(x,y,6,(nx,ny,i,d)=>{
    const k=tiles[i];
    if(d<=R&&k>1){setTile(i,d<=1.6?8:9)}
    else if(d>R&&d<=6&&k!==0&&k!==1)ignite(i,false);
  });
  killAt(x,y,4.5);
  effects.push({k:'boom',x,y,t0:performance.now()});
}
let lastSpawn=null,lastRain=null;
function applyTool(t,x,y,fresh){
  const r=BR[brush];
  switch(t.kind){
    case 'tile':circle(x,y,r,(nx,ny,i)=>setTile(i,t.tile));break;
    case 'spawn':{
      if(!fresh&&lastSpawn&&cheb(x,y,lastSpawn[0],lastSpawn[1])<3)return;
      lastSpawn=[x,y];
      const n=SPAWN_N[brush];
      for(let m=0;m<n;m++){
        const a=Math.random()*6.283,d=Math.sqrt(Math.random())*r,nx=Math.round(x+Math.cos(a)*d),ny=Math.round(y+Math.sin(a)*d);
        if(nx>=0&&ny>=0&&nx<W&&ny<H&&walk(t.t,tiles[ny*W+nx]))addCr(t.t,nx,ny,0)
      }
      break}
    case 'fire':circle(x,y,r,(nx,ny,i)=>{if(brush===0||Math.random()<.6)ignite(i,true)});break;
    case 'bolt':if(fresh)lightning(x,y);break;
    case 'meteor':if(fresh)effects.push({k:'met',x,y,t0:performance.now(),imp:performance.now()+650,done:false});break;
    case 'rain':
      if(fresh||!lastRain||cheb(x,y,lastRain[0],lastRain[1])>=Math.max(2,r)){lastRain=[x,y];rains.push({x,y,r:Math.max(3,r*1.6),left:60})}
      break;
    case 'kill':killAt(x,y,r);break;
  }
}

/* ---------- сохранение ---------- */
function b64(u8){let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s)}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function save(quiet){
  try{
    localStorage.setItem('wb_save',JSON.stringify({v:1,W,H,year,tiles:b64(tiles),
      cr:cr.map(c=>[c.t,c.x,c.y,Math.round(c.hp),c.age,Math.round(c.hun),c.hx,c.hy]),
      bl:Array.from(bld.values()).map(b=>[b.x,b.y,b.race,b.hp])}));
    if(!quiet)toast('Сохранено');return true
  }catch(e){if(!quiet)toast('Не удалось сохранить');return false}
}
function load(quiet){
  try{
    const raw=localStorage.getItem('wb_save');if(!raw){if(!quiet)toast('Нет сохранения');return false}
    const d=JSON.parse(raw);if(d.W!==W||d.H!==H)return false;
    resetState();tiles.set(unb64(d.tiles));year=d.year||0;
    for(let i=0;i<W*H;i++)shade[i]=Math.round((hash(i%W,(i/W)|0,7)-.5)*(tiles[i]<2?8:16));
    for(const a of d.cr){const c=addCr(a[0],a[1],a[2],a[4]);if(c){c.hp=a[3];c.hun=a[5];c.hx=a[6];c.hy=a[7]}}
    for(const b of d.bl)bld.set(b[1]*W+b[0],{x:b[0],y:b[1],race:b[2],hp:b[3]});
    if(!quiet)toast('Загружено');return true
  }catch(e){if(!quiet)toast('Сохранение повреждено');return false}
}

/* ---------- отрисовка ---------- */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const off=document.createElement('canvas');off.width=W;off.height=H;
const octx=off.getContext('2d'),img=octx.createImageData(W,H);
let vw=0,vh=0,dpr=1;
const cam={x:W/2,y:H/2,s:4};
function minScale(){return Math.min(vw/W,vh/H)*.9}
function clampCam(){
  cam.s=Math.max(minScale(),Math.min(30,cam.s));
  cam.x=Math.max(0,Math.min(W,cam.x));cam.y=Math.max(0,Math.min(H,cam.y));
}
function resize(){
  dpr=Math.min(3,window.devicePixelRatio||1);vw=window.innerWidth;vh=window.innerHeight;
  cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);clampCam();
}
function renderTerrain(){
  const d=img.data;
  for(let i=0;i<W*H;i++){const c=COL[tiles[i]],s=shade[i],p=i*4;d[p]=c[0]+s;d[p+1]=c[1]+s;d[p+2]=c[2]+s;d[p+3]=255}
  octx.putImageData(img,0,0);dirty=false;
}
function toTile(sx,sy){return[Math.floor((sx-vw/2)/cam.s+cam.x),Math.floor((sy-vh/2)/cam.s+cam.y)]}

let _px=0,_py=0,_u=1,_f=1;
function R(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(_px+(_f>0?x:8-x-w)*_u,_py+y*_u,w*_u,h*_u)}
function drawCr(c,px,py,s){
  if(s<4){ctx.fillStyle=SP[c.t].col;const q=Math.max(2,s*.9);ctx.fillRect(px+(s-q)/2,py+(s-q)/2,q,q);return}
  _px=px;_py=py;_u=s/8;_f=c.face||1;
  switch(c.t){
    case 'human':R(3,6,2,2,'#2c365e');R(2.5,3,3,3.2,'#3b6fd6');R(3,1,2,2,'#f0c08a');break;
    case 'elf':R(3,6,2,2,'#3a5a35');R(2.5,3,3,3.2,'#2fa35a');R(3,1,2,2,'#f6dcc0');R(3,.5,2,.9,'#e8d36a');R(2.4,1.3,.7,.6,'#f6dcc0');break;
    case 'orc':R(2.5,6,3,2,'#3d2a2a');R(2,3,4,3.4,'#7a2b2b');R(2.6,.9,2.8,2.4,'#6ea53a');R(3.3,2.6,.5,.7,'#fff');break;
    case 'dwarf':R(2.6,6.2,2.8,1.8,'#4a321b');R(2.5,4,3,2.4,'#8a5a2b');R(3,2.6,2,1.6,'#f0c08a');R(2.9,3.8,2.2,1.7,'#c45a1e');R(2.7,1.8,2.6,1,'#b5b9bd');break;
    case 'sheep':R(1.6,6.4,.8,1.4,'#333');R(4.6,6.4,.8,1.4,'#333');R(1,3.4,5.4,3.2,'#f4f4f0');R(5.9,3.7,1.9,2,'#3a3a3a');break;
    case 'wolf':R(1.4,6.2,.8,1.6,'#555');R(5,6.2,.8,1.6,'#555');R(1,3.9,5.6,2.4,'#7d8186');R(6.2,3.3,1.8,2,'#9aa0a6');R(0,3.5,1.4,1,'#6a6e73');R(6.4,2.8,.6,.7,'#6a6e73');break;
  }
}
function drawHouse(b,px,py,s){
  const col=RACE_COL[b.race]||'#a33';
  if(s<4){ctx.fillStyle=col;ctx.fillRect(px+s*.15,py+s*.15,s*.7,s*.7);return}
  const u=s/8;
  ctx.fillStyle='#d8c9a6';ctx.fillRect(px+u,py+3.5*u,6*u,4*u);
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(px+.4*u,py+3.7*u);ctx.lineTo(px+4*u,py+.6*u);ctx.lineTo(px+7.6*u,py+3.7*u);ctx.closePath();ctx.fill();
  ctx.fillStyle='#5a3b1e';ctx.fillRect(px+3.4*u,py+5*u,1.2*u,2.5*u);
}
function render(now,dt){
  if(dirty)renderTerrain();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#050c18';ctx.fillRect(0,0,vw,vh);
  const s=cam.s,ox=vw/2-cam.x*s,oy=vh/2-cam.y*s;
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(off,0,0,W,H,ox,oy,W*s,H*s);
  const x0=Math.max(0,Math.floor(-ox/s)),x1=Math.min(W-1,Math.ceil((vw-ox)/s)),y0=Math.max(0,Math.floor(-oy/s)),y1=Math.min(H-1,Math.ceil((vh-oy)/s));
  // детали ландшафта
  if(s>=6){
    const tt=now/500|0;
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
      const k=tiles[y*W+x],px=ox+x*s,py=oy+y*s;
      if(k===4){
        ctx.fillStyle='#4a3115';ctx.fillRect(px+s*.45,py+s*.7,s*.1,s*.22);
        ctx.fillStyle='#1d5a2a';ctx.fillRect(px+s*.22,py+s*.5,s*.56,s*.22);ctx.fillRect(px+s*.3,py+s*.3,s*.4,s*.22);ctx.fillRect(px+s*.4,py+s*.12,s*.2,s*.2);
      }else if(k===6){
        ctx.fillStyle='#5d5a55';ctx.beginPath();ctx.moveTo(px+s*.05,py+s*.9);ctx.lineTo(px+s*.5,py+s*.1);ctx.lineTo(px+s*.95,py+s*.9);ctx.closePath();ctx.fill();
        ctx.fillStyle='#eef2f6';ctx.beginPath();ctx.moveTo(px+s*.38,py+s*.34);ctx.lineTo(px+s*.5,py+s*.1);ctx.lineTo(px+s*.62,py+s*.34);ctx.closePath();ctx.fill();
      }else if(k===5){
        ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(px+s*.15,py+s*.45,s*.7,s*.3);ctx.fillRect(px+s*.3,py+s*.33,s*.4,s*.14);
      }else if(k<=1){
        if((((x*73856093)^(y*19349663))+tt)%9===0){ctx.fillStyle='rgba(255,255,255,.28)';ctx.fillRect(px+s*.2,py+s*.45,s*.5,Math.max(1,s*.08))}
      }
    }
  }
  // дождевые зоны
  ctx.fillStyle='rgba(120,160,220,.16)';
  for(const r of rains){ctx.beginPath();ctx.arc(ox+(r.x+.5)*s,oy+(r.y+.5)*s,r.r*s,0,6.283);ctx.fill()}
  ctx.strokeStyle='rgba(190,215,255,.7)';ctx.lineWidth=1;ctx.beginPath();
  for(const r of rains){for(let m=0;m<14;m++){const a=Math.random()*6.283,d=Math.sqrt(Math.random())*r.r*s,cx=ox+(r.x+.5)*s+Math.cos(a)*d,cy=oy+(r.y+.5)*s+Math.sin(a)*d;ctx.moveTo(cx,cy);ctx.lineTo(cx-2,cy+7)}}
  ctx.stroke();
  // постройки
  for(const b of bld.values()){if(b.x<x0||b.x>x1||b.y<y0||b.y>y1)continue;drawHouse(b,ox+b.x*s,oy+b.y*s,s)}
  // огонь
  const fl=now/90|0;
  for(const i of fires){
    const x=i%W,y=(i/W)|0;if(x<x0||x>x1||y<y0||y>y1)continue;
    const px=ox+x*s,py=oy+y*s,ph=(fl+i)%3;
    ctx.fillStyle=ph===0?'#ff7a1a':ph===1?'#ffb02e':'#ff4d12';ctx.fillRect(px,py+s*.15,s,s*.85);
    if(s>=4){ctx.fillStyle='#ffe27a';ctx.fillRect(px+s*.3,py+s*.45,s*.4,s*.45)}
  }
  // существа
  const k2=1-Math.exp(-dt/70);
  for(const c of cr){
    c.fx+=(c.x-c.fx)*k2;c.fy+=(c.y-c.fy)*k2;
    if(c.fx<x0-1||c.fx>x1+1||c.fy<y0-1||c.fy>y1+1)continue;
    drawCr(c,ox+c.fx*s,oy+c.fy*s,s);
  }
  // эффекты
  for(let n=effects.length-1;n>=0;n--){
    const e=effects[n],t=now-e.t0,cx=ox+(e.x+.5)*s,cy=oy+(e.y+.5)*s;
    if(e.k==='bolt'){
      if(t>380){effects.splice(n,1);continue}
      ctx.fillStyle='rgba(255,255,255,'+(.35*(1-t/380))+')';ctx.fillRect(0,0,vw,vh);
      ctx.strokeStyle='rgba(255,255,255,'+(1-t/380)+')';ctx.lineWidth=Math.max(2,s*.3);ctx.beginPath();
      let px=cx,py=cy;ctx.moveTo(px,py);
      const seed=e.t0%1000;
      for(let yy=cy;yy>-20;yy-=24){px=cx+(hash(seed,yy|0,3)-.5)*40;py=yy-24;ctx.lineTo(px,py)}
      ctx.stroke();
    }else if(e.k==='met'){
      if(!e.done&&now>=e.imp){e.done=true;crater(e.x,e.y);effects.splice(n,1);continue}
      const p=(now-e.t0)/(e.imp-e.t0);if(p>1)continue;
      const mx=cx-(1-p)*vw*.35,my=cy-(1-p)*vh*.6;
      ctx.strokeStyle='rgba(255,170,60,.7)';ctx.lineWidth=Math.max(3,s*.7);ctx.beginPath();ctx.moveTo(mx-(cx-mx)*.4,my-(cy-my)*.4);ctx.lineTo(mx,my);ctx.stroke();
      ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.arc(mx,my,Math.max(4,s*.8),0,6.283);ctx.fill();
    }else if(e.k==='boom'){
      if(t>700){effects.splice(n,1);continue}
      const p=t/700;ctx.strokeStyle='rgba(255,200,100,'+(1-p)+')';ctx.lineWidth=Math.max(2,s*.6*(1-p));ctx.beginPath();ctx.arc(cx,cy,s*(1+p*7),0,6.283);ctx.stroke();
      ctx.fillStyle='rgba(255,140,40,'+(.5*(1-p))+')';ctx.beginPath();ctx.arc(cx,cy,s*(1+p*4),0,6.283);ctx.fill();
    }
  }
  // курсор кисти (мышь)
  if(cursor&&tool.kind!=='hand'&&tool.kind!=='bolt'&&tool.kind!=='meteor'){
    ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cursor.x,cursor.y,Math.max(s*.5,BR[brush]*s),0,6.283);ctx.stroke();
  }
}

/* ---------- управление ---------- */
const ptrs=new Map();let mode='none',gest=null,lastTile=null,cursor=null;
function paintPoint(sx,sy,fresh){
  const [x,y]=toTile(sx,sy);
  if(x<0||y<0||x>=W||y>=H){lastTile=null;return}
  if(fresh){lastSpawn=null;lastRain=null}
  applyTool(tool,x,y,fresh);lastTile=[x,y];
}
function paintLine(ax,ay,bx,by){
  const [x0,y0]=toTile(ax,ay),[x1,y1]=toTile(bx,by);
  const step=Math.max(1,Math.floor(BR[brush]/2)),dist=Math.max(Math.abs(x1-x0),Math.abs(y1-y0)),n=Math.max(1,Math.ceil(dist/step));
  for(let m=1;m<=n;m++){
    const x=Math.round(x0+(x1-x0)*m/n),y=Math.round(y0+(y1-y0)*m/n);
    if(x>=0&&y>=0&&x<W&&y<H)applyTool(tool,x,y,false);
  }
}
function startGest(){
  const [a,b]=Array.from(ptrs.values()),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
  const [tx,ty]=[(mx-vw/2)/cam.s+cam.x,(my-vh/2)/cam.s+cam.y];
  gest={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,s0:cam.s,tx,ty};
}
function doGest(){
  const [a,b]=Array.from(ptrs.values()),mx=(a.x+b.x)/2,my=(a.y+b.y)/2,d=Math.hypot(a.x-b.x,a.y-b.y);
  cam.s=Math.max(minScale(),Math.min(30,gest.s0*d/gest.d0));
  cam.x=gest.tx-(mx-vw/2)/cam.s;cam.y=gest.ty-(my-vh/2)/cam.s;clampCam();
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});cursor={x:e.clientX,y:e.clientY};
  if(ptrs.size===1){
    if(tool.kind==='hand')mode='pan';else{mode='paint';paintPoint(e.clientX,e.clientY,true)}
  }else if(ptrs.size===2){mode='gest';startGest()}else mode='none';
});
cv.addEventListener('pointermove',e=>{
  cursor={x:e.clientX,y:e.clientY};
  const p=ptrs.get(e.pointerId);if(!p)return;
  const px=p.x,py=p.y;p.x=e.clientX;p.y=e.clientY;
  if(mode==='pan'){cam.x-=(p.x-px)/cam.s;cam.y-=(p.y-py)/cam.s;clampCam()}
  else if(mode==='paint')paintLine(px,py,p.x,p.y);
  else if(mode==='gest'&&ptrs.size>=2)doGest();
});
function up(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size===0)mode='none';else if(ptrs.size<2&&mode==='gest')mode='none';
  if(e.pointerType==='touch')cursor=null;
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')cursor=null});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const tx=(e.clientX-vw/2)/cam.s+cam.x,ty=(e.clientY-vh/2)/cam.s+cam.y;
  cam.s=Math.max(minScale(),Math.min(30,cam.s*Math.exp(-e.deltaY*.0015)));
  cam.x=tx-(e.clientX-vw/2)/cam.s;cam.y=ty-(e.clientY-vh/2)/cam.s;clampCam();
},{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
document.addEventListener('touchmove',e=>{if(e.target===cv)e.preventDefault()},{passive:false});

}
function showMenu(){
  showModal('<h2>Меню</h2><button id="mNew">🌍 Новый мир</button><button id="mSave">💾 Сохранить</button><button id="mLoad">📂 Загрузить</button><button id="mHelp">❓ Как играть</button><button id="mClose">Закрыть</button>');
  $('mNew').onclick=()=>{genWorld((Math.random()*1e6)|0);cam.x=W/2;cam.y=H/2;cam.s=Math.max(minScale(),vw/W*1.4);clampCam();hideModal();toast('Новый мир')};
  $('mSave').onclick=()=>{save();hideModal()};
  $('mLoad').onclick=()=>{load();hideModal()};
  $('mHelp').onclick=showHelp;
  $('mClose').onclick=hideModal;
}
$('bMenu').onclick=showMenu;
const ICONS={human:'🧑',elf:'🧝',orc:'👹',dwarf:'🧔',sheep:'🐑',wolf:'🐺'};
function updateStats(){
  const n={human:0,elf:0,orc:0,dwarf:0,sheep:0,wolf:0};for(const c of cr)n[c.t]++;
  let h='<span>Год <b>'+year+'</b></span>';
  for(const k in n)h+='<span>'+ICONS[k]+' <b>'+n[k]+'</b></span>';
  h+='<span>🏠 <b>'+bld.size+'</b></span>';
  statsEl.innerHTML=h;
}

/* ---------- цикл ---------- */
let last=performance.now(),acc=0;
function frame(now){
  const dt=Math.min(100,now-last);last=now;
  if(!paused){
    acc+=dt*speed;let n=0;
    while(acc>=100&&n<10){tick();acc-=100;n++}
    if(n===10)acc=0;
  }
  render(now,dt);
  requestAnimationFrame(frame);
}

/* ---------- запуск ---------- */
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,200));
document.addEventListener('visibilitychange',()=>{if(document.hidden)save(true)});
window.addEventListener('pagehide',()=>save(true));
setInterval(()=>save(true),30000);
setInterval(updateStats,400);
resize();
if(!load(true))genWorld((Math.random()*1e6)|0);
cam.s=Math.max(minScale(),vw/W*1.4);clampCam();
renderTools();syncHand();updateStats();
try{if(!localStorage.getItem('wb_help'))showHelp()}catch(_){showHelp()}
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
requestAnimationFrame(frame);
window.G={tick,applyTool,get cr(){return cr},get bld(){return bld},tiles,setTool:t=>{tool=t},TOOLS,cam,genWorld};
})();
</script>
</body>
